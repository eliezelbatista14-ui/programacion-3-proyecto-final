<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Editar Reserva</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <h1>Editar Reserva</h1>

    <form
        action="/reservas/editar/{{ reserva[0] }}"
        method="POST"
    >

        <label>Cliente:</label>

        <select name="cliente_id" required>

            {% for cliente in clientes %}

            <option
                value="{{ cliente[0] }}"
                {% if cliente[0] == reserva[1] %}selected{% endif %}
            >
                {{ cliente[1] }}
            </option>

            {% endfor %}

        </select>


        <label>Vestido:</label>

        <select name="vestido_id" required>

            {% for vestido in vestidos %}

            <option
                value="{{ vestido[0] }}"
                {% if vestido[0] == reserva[2] %}selected{% endif %}
            >
                {{ vestido[1] }}
            </option>

            {% endfor %}

        </select>


        <label>Fecha:</label>

        <input
            type="date"
            name="fecha"
            value="{{ reserva[3] }}"
            required
        >

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="/reservas">
        Volver a reservas
    </a>

</body>

</html>
