{% extends "base.html" %}

{% block title %}
Clientes
{% endblock %}

{% block content %}

<h1>Gestión de Clientes</h1>

<form action="/clientes" method="POST">

    <label>Nombre:</label>
    <input type="text" name="nombre" required>

    <label>Teléfono:</label>
    <input type="text" name="telefono" required>

    <label>Correo:</label>
    <input type="email" name="correo">

    <button type="submit">
        Registrar cliente
    </button>

</form>

<h2>Clientes registrados</h2>

<form method="GET" action="/">

    <input
        type="text"
        name="busqueda"
        placeholder="Buscar cliente"
        value="{{ busqueda }}"
    >

    <button type="submit">
        Buscar
    </button>

</form>

<table>

    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Acciones</th>
    </tr>

    {% for cliente in clientes %}

    <tr>

        <td>{{ cliente[0] }}</td>
        <td>{{ cliente[1] }}</td>
        <td>{{ cliente[2] }}</td>
        <td>{{ cliente[3] }}</td>

        <td>
            <form
                action="/clientes/eliminar/{{ cliente[0] }}"
                method="POST"
            >
                <button type="submit">
                    Eliminar
                </button>
            </form>
        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
