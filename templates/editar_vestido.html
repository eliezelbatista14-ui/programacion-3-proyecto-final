<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar vestido</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <h1>Editar vestido</h1>

    <form
        action="/vestidos/editar/{{ vestido[0] }}"
        method="POST"
    >

        <label>Nombre:</label>

        <input
            type="text"
            name="nombre"
            value="{{ vestido[1] }}"
            required
        >

        <label>Descripción:</label>

        <input
            type="text"
            name="descripcion"
            value="{{ vestido[2] }}"
        >

        <label>Precio:</label>

        <input
            type="number"
            step="0.01"
            name="precio"
            value="{{ vestido[3] }}"
            required
        >

        <label>Estado:</label>

        <select name="estado" required>

            <option value="Disponible"
                {% if vestido[4] == 'Disponible' %}selected{% endif %}>
                Disponible
            </option>

            <option value="No disponible"
                {% if vestido[4] == 'No disponible' %}selected{% endif %}>
                No disponible
            </option>

        </select>

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="/vestidos">
        Volver
    </a>

</body>

</html>
